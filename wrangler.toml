name = "finestres-obertes-cameras-api" # matches this repo's name — the deployed Worker's URL follows from it
main = "index.js"
compatibility_date = "2026-09-02"
# Needed so this Worker's fetch() checks can reach the erdrag.workers.dev cameras —
# by default Cloudflare blocks a Worker from fetching another *.workers.dev URL
# (error 1042), which was making every erdrag-hosted cam register as broken.
compatibility_flags = ["global_fetch_strictly_public"]

[triggers]
crons = ["0 * * * *"] # hourly, on the hour

[[d1_databases]]
binding = "DB"
database_name = "finestres-obertes-cameras"
database_id = "5a8db34c-b401-47de-bc24-eae5b424d65a"
